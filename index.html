<!DOCTYPE html>

<body>

    <h2> User Profile </h2> 

    <form id="profileForm">

        <label for="username"> Username: </label>   
        <input type="text" id="username" name="username" required>

        <br><br>

        <label for="birthYear"> Birth Year: </label>
        <input type="number" id="birthYear" name="birthYear" required>

        <br><br>

        <button type="submit"> Create/Update Profile </button>

    </form> 

    <h2> My Hobbies </h2>

    <ul id="hobbiesList">
        <li>Football</li>
        <li>Sport</li>
        <li>Chess</li>
    </ul>

    <input type="text" id="newHobby" placeholder="Enter a new hobby">

    <br><br>

    <button type="button" id="addItem"> Add Item </button>
    <button type="button" id="resetItem"> Reset Item </button>

</body>   

</html>
